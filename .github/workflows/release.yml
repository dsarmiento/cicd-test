name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (analyze only; no tag, commit, GitHub Release, or PyPI)
        type: boolean
        default: true
      pypi_repository_url:
        description: Optional PyPI index URL (e.g. https://test.pypi.org/legacy/)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/lint.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276ce0a02e2ff584f3900c5 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24.2.9 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.0.3 \
            @semantic-release/git@10.0.1 \
            @semantic-release/github@11.0.6 \
            @semantic-release/exec@7.1.0 \
            conventional-changelog-conventionalcommits@8.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          npx semantic-release "${args[@]}"

      - name: Upload Python distribution
        if: inputs.dry_run == false && steps.semantic-release.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/

  publish-pypi:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.dry_run == false &&
      needs.release.outputs.version != '' &&
      vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.pypi_repository_url != '' && inputs.pypi_repository_url || 'https://upload.pypi.org/legacy/' }}
